<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices</title>
<style>
:root{
  --navy:#3a4b84; --navy-d:#2e3c6b; --link:#3b4a8c; --ink:#14161a; --muted:#6c7280;
  --yellow:#fbf4c3; --yellow-d:#e6dc93; --panel:#f7f8fa; --blue:#e8f1fb; --blue-d:#cddbee;
  --line:#e3e5ea; --green:#5e8f6d; --orange:#d9822b; --red:#c8402f; --plus:#6dbb8a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font:14px/1.45 "Open Sans","Segoe UI",system-ui,Arial,sans-serif}
a{color:var(--link)}
.topbar{display:flex;align-items:center;gap:14px;padding:8px 22px;background:#f4f5f8;border-bottom:1px solid var(--line)}
.topbar .brand{font-weight:700;color:var(--navy);letter-spacing:.3px}
.topbar .grow{flex:1}
.chip{font:inherit;font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.chip.ok{color:var(--green)} .chip.bad{color:var(--red)}
.wrap{max-width:1140px;margin:0 auto;padding:22px 20px 60px}
.create{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0 24px;font-weight:600}
.create .plus{width:28px;height:28px;border-radius:50%;background:var(--plus);color:#fff;border:0;font-size:20px;line-height:1;cursor:pointer;margin-right:4px}
.create a{color:var(--link);text-decoration:none;cursor:pointer}
.create a:hover{text-decoration:underline}
.create .dot{color:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end}
.tab{font:inherit;color:var(--ink);background:var(--yellow);border:1px solid var(--yellow-d);border-bottom:0;border-radius:8px 8px 0 0;padding:8px 16px;cursor:pointer;text-decoration:none;position:relative;top:1px}
.tab.on{background:var(--panel);font-weight:600;border-color:var(--line)}
.tab .cl{margin-left:8px;color:var(--muted);font-weight:400}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:20px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:-1px;position:relative;z-index:1}
.stab{font:inherit;font-size:13px;background:var(--yellow);border:1px solid var(--yellow-d);border-bottom:0;border-radius:8px 8px 0 0;padding:7px 14px;cursor:pointer;color:var(--ink)}
.stab.on{background:#fff;border-color:var(--line);font-weight:600}
.cnt{display:inline-block;min-width:20px;text-align:center;font-size:11px;font-weight:700;color:#fff;border-radius:99px;padding:0 6px;margin-left:5px;background:var(--muted)}
.cnt.c-all{background:var(--navy)} .cnt.c-overdue{background:var(--red)} .cnt.c-partial{background:#4a90e2}
.cnt.c-unpaid{background:var(--orange)} .cnt.c-paid,.cnt.c-accepted{background:var(--green)} .cnt.c-sent{background:var(--orange)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 22px}
.tools{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;background:var(--yellow);border:1px solid var(--yellow-d);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
.btn:hover{background:#f6edac}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy-d)}
.btn.red{color:var(--red)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:default}
input,select,textarea{font:inherit;color:var(--ink)}
.field{background:#fff;border:1px solid #cdd3dc;border-radius:5px;padding:6px 9px;width:100%}
.field:focus{outline:2px solid #8da0d6;outline-offset:-1px}
table.list{width:100%;border-collapse:collapse}
table.list th{font-size:12px;font-weight:700;letter-spacing:.3px;padding:14px 10px;border-bottom:1px solid #888;color:var(--ink);white-space:nowrap;cursor:pointer;user-select:none}
table.list th.nos{cursor:default}
table.list th .ar{font-size:9px;color:#9aa0ad;margin-left:3px}
table.list th .ar.on{color:var(--red)}
table.list td{padding:14px 10px;border-bottom:1px solid var(--line)}
table.list tbody tr[data-id]{cursor:pointer}
table.list tbody tr[data-id]:hover{background:#fafbfd}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paidbtn{white-space:nowrap}
.mid{text-align:center}
.paidc{cursor:pointer}
.paidc.full{color:var(--green)} .paidc.part{color:var(--orange)} .paidc.zero{color:var(--orange)}
table.list tr.fyhead td{background:var(--blue);font-weight:600;padding:9px 12px;border:0}
table.list tr.fyhead label{display:inline-flex;gap:6px;align-items:center;margin-left:14px;font-weight:400;font-size:12px}
table.list tr.sub td{font-weight:700;border-top:2px solid #888;border-bottom:0;padding-bottom:3px}
table.list tr.subnote td{font-size:12px;color:var(--muted);padding:2px 10px 18px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);margin-left:8px;font-weight:400}
.tag.filed{color:var(--green);border-color:var(--green)} .tag.cur{color:var(--orange);border-color:var(--orange)}
.paidbtn{font:inherit;font-size:13px;border:1px solid;border-radius:6px;padding:3px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.paidbtn .car{font-size:10px;margin-left:4px}
.paidbtn.paid{background:#e3f4e8;border-color:#a6d3b3;color:#27763f}
.paidbtn.partial{background:#fff1dc;border-color:#f0c88f;color:#b36a14}
.paidbtn.unpaid{background:#fdeae6;border-color:#efb7ac;color:#b23a2a}
.pop{position:absolute;z-index:40;width:250px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 22px rgba(30,40,70,.25);padding:12px;display:flex;flex-direction:column;gap:6px}
.pop .pt2{font-size:12px;color:var(--muted);margin-bottom:2px}
.pop label{font-size:12px;color:var(--muted);margin-top:6px}
.sumblock{margin:14px 0 0;padding-top:6px;border-top:1px solid #888}
.sumblock div{display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;font-size:13px;text-transform:uppercase}
.empty{padding:50px;text-align:center;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
/* editor (type straight into the invoice) */
.formpanel{background:var(--blue);border:1px solid var(--blue-d);border-radius:10px;padding:26px 20px}
.paper{background:#fff;max-width:820px;margin:0 auto;padding:46px 56px 52px;box-shadow:0 1px 8px rgba(40,60,100,.18);font-family:"Noto Sans","Open Sans","Segoe UI",Arial,sans-serif;font-size:13.5px}
.ip{display:block;width:100%;border:1px solid #dfe5f1;background:#fbfcff;border-radius:3px;padding:3px 5px;font:inherit;color:var(--ink);resize:none;overflow:hidden}
.ip:hover{border-color:#9fb0d6;background:#fff}
.ip.sign{width:86px;padding:3px 2px}
.ip:focus{border-color:#7a8fc9;background:#fff;outline:0;box-shadow:0 0 0 2px rgba(122,143,201,.25)}
.ip::placeholder{color:#a3a9b6;font-style:italic}
.ip.right{text-align:right}
.ip.title{font-size:20px;font-weight:700}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.ph .doc{font-size:20px;font-weight:700;padding:3px 5px}
.mid2{display:flex;justify-content:space-between;gap:30px;margin:34px 0 28px}
.mid2 .bill{flex:1;max-width:400px}
.lbl{font-weight:700;padding:0 5px 2px}
.meta{display:grid;grid-template-columns:auto 150px;gap:4px 10px;align-items:center;align-self:start}
.meta .k{font-weight:700;text-align:right}
table.lines{width:100%;border-collapse:collapse;table-layout:fixed}
table.lines th{background:#f6f6f6;border:1px solid #ddd;font-size:12px;padding:8px;text-align:center}
table.lines td{border:1px solid #ddd;padding:3px;vertical-align:top;position:relative}
table.lines td.rm{width:0;border:0;padding:0;overflow:visible}
table.lines td.rm .x{position:absolute;left:100%;top:6px;margin-left:6px}
table.lines td.amtc{width:150px}
.x{border:0;background:none;color:#b9bcc5;cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.x:hover{color:var(--red)}
.pctrow{display:flex;align-items:center;gap:4px}
.pctrow .ip.pct{width:70px;text-align:right}
.calc{text-align:right;padding:8px 9px !important;color:var(--muted)}
.totrow{display:flex;justify-content:flex-end;align-items:stretch;margin-top:0}
.totrow .tl{font-weight:700;font-size:15px;padding:12px 10px;width:calc(100% - 150px);text-align:right}
.totrow .tv{width:150px;font-weight:700;font-size:15px;background:#f6f6f6;border:1px solid #ddd;border-top:0;padding:12px 9px;text-align:right}
.below{display:flex;justify-content:space-between;gap:30px;margin-top:22px}
.below .notes{flex:1;max-width:420px}
.sigbox{width:170px;position:relative;text-align:center}
.sigbox img{max-width:150px;max-height:80px;display:block;margin:0 auto}
.sigbox .x{position:absolute;right:0;top:0}
.addrow2{display:flex;gap:8px;margin:10px 0 4px}
.addrow2 .btn{flex:1;padding:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;max-width:820px;margin:16px auto 0;align-items:center}
.actions .grow{flex:1}
.paidbox{display:flex;gap:8px;align-items:center;max-width:820px;margin:16px auto 0;font-size:13px}
.paidbox input{width:130px}
.savebar{max-width:820px;margin:16px auto 0}
.savebar .btn{width:100%;padding:11px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,24,40,.6);z-index:30;display:flex;flex-direction:column;padding:18px}
.modal iframe{flex:1;border:0;background:#fff;border-radius:6px;max-width:900px;width:100%;margin:8px auto 0}
.modal .btn{align-self:flex-end;max-width:900px}
.card.custcard{margin-bottom:12px;border-radius:10px}
.sig{max-width:260px;max-height:100px;display:block;margin:8px 0;border:1px solid var(--line);border-radius:6px;background:#fff}
canvas.pad{width:100%;max-width:420px;height:130px;border:1px dashed var(--muted);border-radius:8px;touch-action:none;background:#fff;cursor:crosshair}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel label.l{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
h1.pt{font-size:18px;margin:0 0 14px}
h2.st{font-size:12px;margin:20px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:50}
@media (max-width:760px){ .paper{padding:24px 16px} .mid2{flex-direction:column} .below{flex-direction:column} table.lines td.rm .x{left:auto;right:2px;margin:0} }
</style>
</head>
<body>
<div class="topbar"><span class="brand">Invoices</span><span class="grow"></span><button class="chip" id="drive"></button></div>
<div class="wrap">
  <div class="create"><button class="plus" id="plus" title="New invoice">+</button>
    <a data-new="invoice">Invoice</a><span class="dot">·</span><a data-new="quote">Quote</a></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="app"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.gsiLoaded=true;window.initGoogle&&initGoogle()"></script>
<script>
/* ---------------------------------------------------------------
   Paste your Google OAuth client ID here (see README.md).
   Without it the app still works, it just saves to this browser only.
---------------------------------------------------------------- */
const GOOGLE_CLIENT_ID = '137075271992-st7deo4q3m0pptfo02ep31638bj07tor.apps.googleusercontent.com';

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const FOLDER_NAME = 'Invoices';
const DATA_FILE = 'invoice-data.json';
const LS_KEY = 'invoice_app_data_v1';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
function today(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const fmtDate = iso => iso ? iso.split('-').reverse().join('/') : '';
function parseMoney(s){ const n = parseFloat(String(s ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : Math.round(n * 100); }
function fmtMoney(c){ return (c < 0 ? '-' : '') + (Math.abs(c) / 100).toLocaleString('en-NZ', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
const firstLine = s => String(s || '').split('\n')[0].trim();
const slug = s => String(s || '').trim().replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const autogrow = el => { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; };

/* ---------- state ---------- */
const defaults = () => ({
  v: 1, updatedAt: 0,
  profile: {name: '', details: '', symbol: '$', currencyCode: 'NZD', signature: null, defaultNotes: '', fyStartMonth: 4, filedYears: [], whtRate: 20},
  counters: {invoice: 30, quote: 1},
  clients: [], docs: []
});
function normalize(r){
  const base = defaults();
  const out = Object.assign(base, r, {profile: Object.assign(base.profile, r.profile), counters: Object.assign(base.counters, r.counters)});
  out.docs = out.docs.filter(d => !d.trashed);
  for (const d of out.docs){
    if (d.type === 'invoice' && d.paid === undefined) d.paid = d.status === 'paid' ? (compute(d).total / 100).toFixed(2) : '0';
  }
  return out;
}
let S = load();
function load(){
  try { const r = JSON.parse(localStorage.getItem(LS_KEY)); if (r && r.v) return normalize(r); } catch (e) {}
  return defaults();
}
let dirtyDrive = false;
function persist(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast('Could not save to this browser (storage full?)'); }
  if (drv.state === 'off' || drv.state === 'ready' || drv.state === 'expired') dirtyDrive = true;
  else queueDriveSave();
}

/* ---------- money / documents ---------- */
function compute(d){
  const sub = d.lines.filter(l => l.kind !== 'percent').reduce((a, l) => a + parseMoney(l.amount), 0);
  const rows = d.lines.map(l => {
    if (l.kind === 'percent'){
      const p = parseFloat(l.pct) || 0;
      return {desc: `${l.desc || ''} ${Math.abs(p)}%`.trim(), cents: Math.round(sub * p / 100), wht: p < 0};
    }
    return {desc: l.desc || '', cents: parseMoney(l.amount), wht: false};
  });
  return {rows, sub, total: rows.reduce((a, r) => a + r.cents, 0), wht: rows.filter(r => r.wht).reduce((a, r) => a + r.cents, 0)};
}
function payState(d){
  const total = compute(d).total, paid = parseMoney(d.paid);
  if (total > 0 && paid >= total) return 'paid';
  return paid > 0 ? 'partial' : 'unpaid';
}
const isOverdue = d => d.type === 'invoice' && !d.trashed && payState(d) !== 'paid' && d.dueDate && d.dueDate < today();
function newDoc(type){
  const key = type === 'quote' ? 'quote' : 'invoice';
  const d = {
    id: uid(), type: key, number: String(S.counters[key]), date: today(), dueDate: '',
    billTo: '', clientId: '', lines: [{kind: 'amount', desc: '', amount: ''}],
    notes: S.profile.defaultNotes || '', useSignature: true, status: 'draft', paid: '0', trashed: false,
    pdfFileId: '', createdAt: Date.now(),
    from: {name: S.profile.name, details: S.profile.details}
  };
  S.counters[key]++;
  S.docs.unshift(d);
  persist();
  return d;
}
function pdfName(d){
  const who = slug(firstLine(d.billTo)) || 'Client';
  return `${d.type === 'quote' ? 'Quote-' : ''}${slug(d.number) || 'draft'}-${who}.pdf`;
}
const money = c => `${S.profile.symbol} ${fmtMoney(c)}`;

/* ---------- PDF (follows the original invoice template) ---------- */
function buildPdf(d, p){
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'pt', format: 'a4'});
  const L = 57, R = 538, COL = 411, isQ = d.type === 'quote';
  const F = d.from || p;
  const sym = p.symbol || '$';
  const GRAY = [246, 246, 246], LINE = [221, 221, 221];
  pdf.setTextColor(0);

  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(16);
  pdf.text(F.name || '', L, 76);
  pdf.text(isQ ? 'QUOTE' : 'INVOICE', R, 76, {align: 'right'});

  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10);
  let y = 113;
  for (const ln of (F.details || '').split('\n')){
    for (const w of pdf.splitTextToSize(ln || ' ', 300)){ pdf.text(w, L, y); y += 14.5; }
  }

  const billY = Math.max(283, y + 40);
  pdf.setFont('helvetica', 'bold'); pdf.text('Bill To', L, billY);
  pdf.setFont('helvetica', 'normal');
  let by = billY + 18;
  for (const ln of (d.billTo || '').split('\n')){
    for (const w of pdf.splitTextToSize(ln || ' ', 280)){ pdf.text(w, L, by); by += 14.5; }
  }
  const meta = [[isQ ? 'Quote #' : 'Invoice #', String(d.number || '')], [isQ ? 'Quote Date' : 'Invoice Date', fmtDate(d.date)]];
  if (d.dueDate) meta.push([isQ ? 'Valid Until' : 'Due Date', fmtDate(d.dueDate)]);
  let my = billY;
  for (const [k, v] of meta){
    pdf.setFont('helvetica', 'bold'); pdf.text(k, 456, my, {align: 'right'});
    pdf.setFont('helvetica', 'normal'); pdf.text(v, R, my, {align: 'right'});
    my += 17;
  }

  pdf.setDrawColor(...LINE); pdf.setLineWidth(0.6);
  let ty = Math.max(366, by + 22, my + 10);
  const header = () => {
    pdf.setFillColor(...GRAY); pdf.rect(L, ty, COL - L, 26, 'FD'); pdf.rect(COL, ty, R - COL, 26, 'FD');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10);
    pdf.text('DESCRIPTION', (L + COL) / 2, ty + 16, {align: 'center'});
    pdf.text('AMOUNT', (COL + R) / 2, ty + 16, {align: 'center'});
    pdf.setFont('helvetica', 'normal'); ty += 26;
  };
  header();
  const {rows, total} = compute(d);
  for (const r of rows){
    const lines = pdf.splitTextToSize(r.desc || ' ', COL - L - 14);
    const h = Math.max(26, lines.length * 13 + 13);
    if (ty + h > 770){ pdf.addPage(); ty = 60; header(); }
    pdf.rect(L, ty, COL - L, h); pdf.rect(COL, ty, R - COL, h);
    lines.forEach((w, i) => pdf.text(w, L + 7, ty + 16 + i * 13));
    pdf.text(fmtMoney(r.cents), R - 9, ty + 16, {align: 'right'});
    ty += h;
  }
  if (ty + 40 > 790){ pdf.addPage(); ty = 60; }
  pdf.setFillColor(...GRAY); pdf.rect(COL, ty, R - COL, 28, 'FD');
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(14);
  pdf.text('TOTAL', COL - 9, ty + 19, {align: 'right'});
  pdf.text(`${sym} ${fmtMoney(total)}`, R - 9, ty + 19, {align: 'right'});
  ty += 28;

  let sy = ty + 12;
  const hasSig = d.useSignature && p.signature;
  let sigH = 0, sigW = 0;
  if (hasSig){
    const ip = pdf.getImageProperties(p.signature);
    sigW = Math.min(130, ip.width); sigH = sigW * ip.height / ip.width;
    if (sigH > 80){ sigH = 80; sigW = sigH * ip.width / ip.height; }
  }
  const noteLines = d.notes ? pdf.splitTextToSize(d.notes, 300) : [];
  const need = Math.max(sigH, noteLines.length * 13 + 18);
  if (sy + need > 800){ pdf.addPage(); sy = 60; }
  if (noteLines.length){
    pdf.setFontSize(10); pdf.setFont('helvetica', 'bold'); pdf.text('Terms & Conditions', L, sy + 10);
    pdf.setFont('helvetica', 'normal');
    noteLines.forEach((w, i) => pdf.text(w, L, sy + 25 + i * 13));
  }
  if (hasSig) pdf.addImage(p.signature, 'PNG', R - sigW, sy, sigW, sigH);
  return pdf;
}

/* ---------- Google Drive ---------- */
const drv = {state: 'off', msg: ''};
let tokenClient = null, accessToken = null, tokenExp = 0, folderId = null, dataFileId = null;
const clientId = () => GOOGLE_CLIENT_ID || localStorage.getItem('invoice_app_client_id') || '';

function setDrive(state, msg = ''){
  drv.state = state; drv.msg = msg;
  const b = $('#drive');
  const map = {
    off: ['Drive: not set up', ''], ready: ['Connect Google Drive', ''], connecting: ['Connecting…', ''],
    connected: ['Synced to Drive' + (msg ? ' · ' + msg : ''), 'ok'], saving: ['Saving to Drive…' + (msg ? ' · ' + msg : ''), ''],
    expired: ['Sign in to Drive again', 'bad'], error: ['Drive error (click for details)', 'bad']
  };
  const [t, c] = map[state];
  b.textContent = t; b.className = 'chip ' + c; b.title = msg;
}
$('#drive').onclick = () => {
  if (!clientId()) return alert('Drive sync is not set up yet.\n\nPaste your Google OAuth client ID into GOOGLE_CLIENT_ID at the top of index.html (see README.md), or into Settings to test. Until then everything is saved in this browser only.');
  if (!tokenClient) return alert('Google sign-in has not loaded yet (offline?). Reload and try again.');
  if (drv.state === 'error') return alert(drv.msg);
  if (drv.state === 'ready' || drv.state === 'expired') { setDrive('connecting'); tokenClient.requestAccessToken(); }
};

function initGoogle(){
  if (!clientId() || !window.google || !google.accounts || !google.accounts.oauth2) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId(), scope: DRIVE_SCOPE,
    callback: async r => {
      if (r.error){ setDrive('ready'); return; }
      accessToken = r.access_token; tokenExp = Date.now() + (r.expires_in - 60) * 1000;
      try { await syncFromDrive(); await afterSync(); } catch (e) { setDrive('error', String(e.message || e)); }
    },
    error_callback: () => setDrive('ready')
  });
  setDrive('ready');
}
setDrive(clientId() ? 'ready' : 'off');
if (window.gsiLoaded) initGoogle();

async function driveReq(url, opts = {}){
  if (!accessToken || Date.now() > tokenExp){ setDrive('expired'); throw new Error('Sign in to Drive again'); }
  const r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: 'Bearer ' + accessToken}});
  if (r.status === 401){ accessToken = null; setDrive('expired'); throw new Error('Sign in to Drive again'); }
  if (!r.ok) throw new Error('Drive ' + r.status + ': ' + (await r.text()).slice(0, 300));
  return r;
}
const q = s => encodeURIComponent(s);
async function findOne(query){
  const r = await driveReq(`https://www.googleapis.com/drive/v3/files?q=${q(query)}&fields=files(id,name,modifiedTime)&pageSize=1`);
  return (await r.json()).files[0] || null;
}
async function getFolder(){
  if (folderId) return folderId;
  const f = await findOne(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  if (f) return rememberFolder(f.id);
  const r = await driveReq('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder'})
  });
  return rememberFolder((await r.json()).id);
}
function rememberFolder(id){ folderId = id; try { localStorage.setItem('invoice_app_folder_id', id); } catch (e) {} return id; }
function multipart(meta, blob, mime){
  const b = 'ib' + Math.random().toString(16).slice(2);
  return {
    type: `multipart/related; boundary=${b}`,
    body: new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`, blob, `\r\n--${b}--`])
  };
}
async function putFile(name, existingId, blob, mime){
  const parent = await getFolder();
  const send = async id => {
    const m = multipart(id ? {name} : {name, parents: [parent]}, blob, mime);
    const url = id ? `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart&fields=id`
                   : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id';
    return (await driveReq(url, {method: id ? 'PATCH' : 'POST', headers: {'Content-Type': m.type}, body: m.body})).json();
  };
  if (existingId){
    try { return (await send(existingId)).id; }
    catch (e) { if (!/Drive 404/.test(e.message)) throw e; }
  }
  return (await send(null)).id;
}
async function pushData(){
  S.updatedAt = Date.now();
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  dataFileId = await putFile(DATA_FILE, dataFileId, new Blob([JSON.stringify(S)], {type: 'application/json'}), 'application/json');
  dirtyDrive = false;
  setDrive('connected', new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}));
}
const queueDriveSave = debounce(async () => {
  if (!accessToken) { dirtyDrive = true; return; }
  try { setDrive('saving'); await pushData(); } catch (e) { dirtyDrive = true; if (drv.state !== 'expired') setDrive('error', String(e.message || e)); }
}, 1500);

async function syncFromDrive(){
  setDrive('saving');
  const parent = await getFolder();
  const f = await findOne(`name='${DATA_FILE}' and '${parent}' in parents and trashed=false`);
  if (f){
    dataFileId = f.id;
    const remote = await (await driveReq(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json();
    if (remote && remote.v && (remote.updatedAt || 0) > (S.updatedAt || 0) && !dirtyDrive){
      S = normalize(remote);
      localStorage.setItem(LS_KEY, JSON.stringify(S));
      route();
      setDrive('connected', 'loaded');
      return;
    }
  }
  await pushData();
}
/* PDFs: every fully paid invoice is exported to the Drive folder. Work is queued (pdfPending) so it also
   happens later if Drive is not connected at the moment an invoice is marked paid. */
let flushing = false;
async function flushPdfs(){
  if (flushing || !accessToken || !window.jspdf) return;
  const todo = S.docs.filter(d => d.pdfPending);
  if (!todo.length) return;
  flushing = true;
  let n = 0;
  try {
    for (const d of todo){
      setDrive('saving', `PDF ${++n}/${todo.length}`);
      d.pdfFileId = await putFile(pdfName(d), d.pdfFileId, buildPdf(d, S.profile).output('blob'), 'application/pdf');
      d.pdfPending = false; d.pdfUploadedAt = Date.now();
      localStorage.setItem(LS_KEY, JSON.stringify(S));
    }
    await pushData();
    toast(todo.length === 1 ? 'PDF saved to Drive: ' + pdfName(todo[0]) : `${todo.length} PDFs saved to Drive`);
  } catch (e) {
    if (drv.state !== 'expired') setDrive('error', String(e.message || e));
    toast('PDF upload failed: ' + (e.message || e));
  } finally { flushing = false; }
}
function afterPaid(d){
  if (d.type !== 'invoice' || payState(d) !== 'paid') return persist();
  d.pdfPending = true; persist();
  if (accessToken) flushPdfs(); else toast('Marked paid. The PDF goes to Drive when you connect.');
}
async function afterSync(){
  const missing = S.docs.filter(d => d.type === 'invoice' && payState(d) === 'paid' && !d.pdfFileId && !d.pdfPending);
  if (missing.length && !localStorage.getItem('invoice_app_backfill_asked')){
    localStorage.setItem('invoice_app_backfill_asked', '1');
    if (confirm(`${missing.length} paid invoice${missing.length === 1 ? ' has' : 's have'} no PDF in your Drive folder yet. Upload them now?`)) missing.forEach(d => d.pdfPending = true);
  }
  persist();
  await flushPdfs();
}
window.addEventListener('beforeunload', e => { if (dirtyDrive && clientId()) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- router + tabs ---------- */
const app = $('#app');
function route(){
  const h = location.hash.replace(/^#\/?/, '') || 'invoices';
  const [name, arg] = h.split('/');
  const editing = name === 'edit' ? S.docs.find(d => d.id === arg) : null;
  const cur = editing ? (editing.type === 'quote' ? 'quotes' : 'invoices') : name;
  const tabs = [['invoices', 'My Invoices'], ['quotes', 'My Quotes'], ['customers', 'My Customers'], ['settings', 'Settings']];
  $('#tabs').innerHTML = tabs.map(([r, l]) => `<a class="tab ${!editing && (cur === r || (r === 'customers' && cur === 'clients')) ? 'on' : ''}" href="#/${r}">${l}</a>`).join('') +
    (editing ? `<span class="tab on">${editing.type === 'quote' ? 'Quote' : 'Invoice'} ${esc(editing.number)}<a class="cl" href="#/${cur}" title="Close" style="text-decoration:none">✕</a></span>` : '');
  if (name === 'invoices') viewDocs('invoice');
  else if (name === 'quotes') viewDocs('quote');
  else if (name === 'customers' || name === 'clients') viewClients();
  else if (name === 'settings') viewSettings();
  else if (name === 'edit') viewEdit(arg);
  else viewDocs('invoice');
  if (!editing) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$$('[data-new]').forEach(a => a.onclick = () => { const d = newDoc(a.dataset.new); location.hash = '#/edit/' + d.id; });
$('#plus').onclick = () => { const d = newDoc('invoice'); location.hash = '#/edit/' + d.id; };

/* ---------- financial years ---------- */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fyStartMonth = () => S.profile.fyStartMonth || 4;
function fyOf(iso){ const [y, m] = (iso || today()).split('-').map(Number); return m >= fyStartMonth() ? y : y - 1; }
const fyLabel = y => fyStartMonth() === 1 ? String(y) : `${y}–${String(y + 1).slice(2)}`;
function fyRange(y){
  const sm = fyStartMonth(), em = sm === 1 ? 12 : sm - 1, ey = sm === 1 ? y : y + 1;
  return `1 ${MON[sm - 1]} ${y} – ${new Date(ey, em, 0).getDate()} ${MON[em - 1]} ${ey}`;
}
function stats(ds){
  let total = 0, wht = 0, paid = 0;
  for (const d of ds){ const c = compute(d); total += c.total; wht += c.wht; paid += Math.min(parseMoney(d.paid), Math.max(c.total, parseMoney(d.paid))); }
  return {n: ds.length, total, wht, gross: total - wht, paid, due: total - paid};
}

/* ---------- invoice / quote lists ---------- */
const listState = {
  invoice: {sort: 'date', dir: -1, q: ''},
  quote: {sort: 'date', dir: -1, q: ''}
};
let openMenu = null;
function closeMenu(){ if (openMenu){ openMenu.remove(); openMenu = null; } }
document.addEventListener('click', e => { if (openMenu && !e.target.closest('.pop') && !e.target.closest('[data-paidmenu]')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

function viewDocs(type){
  closeMenu();
  const isQ = type === 'quote', st = listState[type];
  const mine = S.docs.filter(d => d.type === type);
  app.innerHTML = `
    <div class="card">
      <div class="tools" style="justify-content:space-between">
        <h1 class="pt" style="margin:0">${isQ ? 'All Quotes' : 'All Invoices'} <span class="hint">${mine.length}</span></h1>
        <div class="tools" style="margin:0">
          <input class="field" id="q" placeholder="Search customer, number, item…" style="width:250px" value="${esc(st.q)}">
          ${isQ ? '' : '<button class="btn" id="drivefolder">Show invoices in Drive</button><button class="btn" id="csv">Export CSV</button>'}
          <button class="btn navy" id="new">New ${isQ ? 'quote' : 'invoice'}</button>
        </div>
      </div>
      <div id="out"></div>
    </div>`;

  const val = {
    customer: d => firstLine(d.billTo).toLowerCase(), number: d => parseFloat(d.number) || 0,
    date: d => d.date || '', paid: d => parseMoney(d.paid), total: d => compute(d).total, status: d => d.status
  };
  const rows = () => {
    const term = st.q.toLowerCase();
    return mine.filter(d => !term || [d.number, d.billTo, d.lines.map(l => l.desc).join(' ')].join(' ').toLowerCase().includes(term))
      .sort((a, b) => {
        const x = val[st.sort](a), y = val[st.sort](b);
        const c = x < y ? -1 : x > y ? 1 : 0;
        return st.dir * (c || ((a.date || '').localeCompare(b.date || '')) || (parseFloat(a.number) - parseFloat(b.number)));
      });
  };
  const th = (key, label, cls = '') => `<th class="${cls}" data-sort="${key}">${label}<span class="ar ${st.sort === key ? 'on' : ''}">${st.sort === key ? (st.dir < 0 ? '▼' : '▲') : '⬍'}</span></th>`;
  const docRow = d => {
    const c = compute(d), paid = parseMoney(d.paid);
    const col4 = isQ
      ? `<td class="mid"><select class="field" style="width:auto;padding:2px 6px" data-qst="${d.id}">${['draft', 'sent', 'accepted', 'declined'].map(x => `<option ${d.status === x ? 'selected' : ''}>${x}</option>`).join('')}</select></td>`
      : `<td class="num"><button class="paidbtn ${payState(d)}" data-paidmenu="${d.id}" title="Set paid / partially paid">${money(paid)} <span class="car">▾</span></button></td>`;
    return `<tr data-id="${d.id}"><td>${esc(firstLine(d.billTo)) || '<span class="hint">no customer</span>'}</td><td class="mid">${esc(d.number)}</td><td class="mid">${fmtDate(d.date)}</td>${col4}<td class="num">${money(c.total)}</td></tr>`;
  };
  const sumBlock = ds => {
    const s = stats(ds), cc = esc(S.profile.currencyCode);
    return isQ ? `<div class="sumblock"><div><span>Total</span><span>${fmtMoney(s.total)} ${cc}</span></div></div>`
      : `<div class="sumblock"><div><span>Total</span><span>${fmtMoney(s.total)} ${cc}</span></div>
         <div><span>Paid amount</span><span>${fmtMoney(s.paid)} ${cc}</span></div>
         <div><span>Balance due</span><span>${fmtMoney(s.due)} ${cc}</span></div></div>`;
  };
  const draw = () => {
    closeMenu();
    const docs = rows();
    if (!docs.length){ $('#out').innerHTML = `<div class="empty">${mine.length ? 'Nothing matches.' : `No ${isQ ? 'quotes' : 'invoices'} yet.`}</div>`; return; }
    const head = `<thead><tr>${th('customer', 'CUSTOMER')}${th('number', 'NUMBER')}${th('date', 'DATE')}${isQ ? th('status', 'STATUS') : th('paid', 'PAID')}${th('total', 'TOTAL')}</tr></thead>`;
    let body = '';
    if (!isQ && st.sort === 'date'){
      const groups = new Map();
      docs.forEach(d => { const y = fyOf(d.date); if (!groups.has(y)) groups.set(y, []); groups.get(y).push(d); });
      const thisFy = fyOf(today());
      for (const y of [...groups.keys()].sort((a, b) => st.dir < 0 ? b - a : a - b)){
        const ds = groups.get(y), s = stats(ds), filed = (S.profile.filedYears || []).includes(y);
        body += `<tr class="fyhead"><td colspan="5">Financial year ${fyLabel(y)} <span class="hint">${fyRange(y)}</span>
          <span class="tag ${filed ? 'filed' : y === thisFy ? 'cur' : ''}">${filed ? 'Filed in tax return' : y === thisFy ? 'Current year' : 'Not filed'}</span>
          <label><input type="checkbox" data-filed="${y}" ${filed ? 'checked' : ''}> filed in tax return</label></td></tr>`;
        body += ds.map(docRow).join('');
        body += `<tr class="sub"><td colspan="3">Total ${fyLabel(y)} · ${s.n} invoice${s.n === 1 ? '' : 's'}</td><td class="num">${money(s.paid)}</td><td class="num">${money(s.total)}</td></tr>
          <tr class="subnote"><td colspan="5">Balance due ${money(s.due)}${s.wht ? ` · Before withholding ${money(s.gross)} · Withholding tax ${money(s.wht)}` : ''}</td></tr>`;
      }
    } else body = docs.map(docRow).join('');
    $('#out').innerHTML = `<table class="list">${head}<tbody>${body}</tbody></table>${sumBlock(docs)}`;
  };

  $('#q').oninput = e => { st.q = e.target.value; draw(); };
  $('#new').onclick = () => { const d = newDoc(type); location.hash = '#/edit/' + d.id; };
  const df = $('#drivefolder');
  if (df) df.onclick = async () => {
    let fid = folderId || localStorage.getItem('invoice_app_folder_id');
    if (!fid && accessToken){ try { fid = await getFolder(); } catch (e) { return toast('Could not find the Drive folder: ' + (e.message || e)); } }
    if (!fid) return toast('Connect Google Drive first (top right).');
    window.open('https://drive.google.com/drive/folders/' + fid, '_blank');
  };
  const csv = $('#csv');
  if (csv) csv.onclick = () => {
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const out = [['Number', 'Customer', 'Date', 'Financial year', 'Before withholding', 'Withholding tax', 'Total', 'Paid'].map(cell).join(',')];
    for (const d of rows().slice().reverse()){
      const c = compute(d);
      out.push([d.number, firstLine(d.billTo), d.date, fyLabel(fyOf(d.date)), (c.total - c.wht) / 100, c.wht / 100, c.total / 100, parseMoney(d.paid) / 100].map(cell).join(','));
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + out.join('\r\n')], {type: 'text/csv'}));
    a.download = 'invoices.csv'; a.click();
  };

  const openPaidMenu = btn => {
    closeMenu();
    const d = S.docs.find(x => x.id === btn.dataset.paidmenu), total = compute(d).total;
    const m = document.createElement('div'); m.className = 'pop';
    m.innerHTML = `<div class="pt2">Invoice ${esc(d.number)} · total ${money(total)}</div>
      <button class="btn" data-set="paid">Set as paid</button>
      <button class="btn" data-set="unpaid">Set as unpaid</button>
      <label>Partially paid: amount received</label>
      <div style="display:flex;gap:6px"><input class="field" inputmode="decimal" placeholder="0.00" value="${parseMoney(d.paid) > 0 && parseMoney(d.paid) < total ? (parseMoney(d.paid) / 100).toFixed(2) : ''}"><button class="btn navy" data-set="part">Set</button></div>`;
    const apply = how => {
      if (how === 'paid') d.paid = (total / 100).toFixed(2);
      else if (how === 'unpaid') d.paid = '0';
      else d.paid = String(parseMoney($('input', m).value) / 100);
      draw(); afterPaid(d);
    };
    m.addEventListener('click', e => { const b = e.target.closest('[data-set]'); if (b) apply(b.dataset.set); });
    $('input', m).addEventListener('keydown', e => { if (e.key === 'Enter') apply('part'); });
    document.body.appendChild(m);
    const r = btn.getBoundingClientRect();
    m.style.top = (r.bottom + window.scrollY + 4) + 'px';
    m.style.left = Math.max(8, r.right + window.scrollX - m.offsetWidth) + 'px';
    openMenu = m;
    $('input', m).focus();
  };

  const out = $('#out');
  out.addEventListener('click', e => {
    const t = e.target;
    const h = t.closest('th[data-sort]');
    if (h){ const k = h.dataset.sort; if (st.sort === k) st.dir *= -1; else { st.sort = k; st.dir = k === 'customer' ? 1 : -1; } return draw(); }
    const pb = t.closest('[data-paidmenu]');
    if (pb) return openPaidMenu(pb);
    if (t.closest('input,button,select,th,label')) return;
    const tr = t.closest('tr[data-id]');
    if (tr) location.hash = '#/edit/' + tr.dataset.id;
  });
  out.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.qst){ S.docs.find(d => d.id === t.dataset.qst).status = t.value; persist(); return; }
    if (t.dataset.filed){
      const y = +t.dataset.filed, set = new Set(S.profile.filedYears || []);
      t.checked ? set.add(y) : set.delete(y);
      S.profile.filedYears = [...set]; persist(); draw();
    }
  });
  draw();
}

    linesEl.innerHTML = d.lines.map((l, i) => l.kind === 'percent'
      ? `<tr data-i="${i}"><td><div class="pctrow"><input class="ip" data-f="desc" placeholder="Label, e.g. Withholding tax" value="${esc(l.desc)}"><select class="ip sign" data-f="sign" title="Deduct from, or add to, the items above"><option value="-" ${parseFloat(l.pct) < 0 ? 'selected' : ''}>deduct</option><option value="+" ${parseFloat(l.pct) < 0 ? '' : 'selected'}>add</option></select><input class="ip pct" data-f="pctabs" placeholder="20" value="${l.pct === '' || l.pct == null ? '' : esc(String(Math.abs(parseFloat(l.pct)) || ''))}"><span>%</span></div></td><td class="calc" data-calc></td><td class="rm"><button class="x" data-del title="Remove">×</button></td></tr>`
      : `<tr data-i="${i}"><td><textarea class="ip auto" rows="1" data-f="desc" placeholder="Description">${esc(l.desc)}</textarea></td><td class="amtc"><input class="ip right" data-f="amount" placeholder="0.00" inputmode="decimal" value="${esc(l.amount)}"></td><td class="rm"><button class="x" data-del title="Remove">×</button></td></tr>`).join('');
    $$('textarea.auto', app).forEach(autogrow);
    calcs();
  };
  const drawSig = () => {
    $('#sig').innerHTML = !P.signature ? '<span class="hint">No signature yet. Add one in <a href="#/settings">Settings</a>.</span>'
      : d.useSignature ? `<img src="${P.signature}" alt="signature"><button class="x" id="sigoff" title="Remove signature from this document">×</button>`
      : '<button class="btn sm" id="sigon">Add signature</button>';
    const off = $('#sigoff'), on = $('#sigon');
    if (off) off.onclick = () => { d.useSignature = false; persist(); drawSig(); };
    if (on) on.onclick = () => { d.useSignature = true; persist(); drawSig(); };
  };
  const calcs = () => {
    const c = compute(d);
    $$('tr[data-i]', linesEl).forEach(tr => { const cell = $('[data-calc]', tr); if (cell) cell.textContent = fmtMoney(c.rows[+tr.dataset.i].cents); });
    $('#tot').textContent = `${P.symbol} ${fmtMoney(c.total)}`;
    const bal = $('#bal'); if (bal) bal.textContent = `Balance due ${P.symbol} ${fmtMoney(c.total - parseMoney(d.paid))}`;
    const known = d.clientId && S.clients.some(x => x.id === d.clientId);
    $('#saveClientRow').innerHTML = d.billTo.trim() && !known ? '<button class="btn sm" id="saveClient" style="margin-left:5px">Save as customer</button>' : '';
    const sc = $('#saveClient');
    if (sc) sc.onclick = () => {
      const [name, ...rest] = d.billTo.split('\n');
      const cl = {id: uid(), name: name.trim(), details: rest.join('\n').trim()};
      S.clients.push(cl); d.clientId = cl.id; persist(); viewEdit(id); toast('Customer saved');
    };
  };
  const touch = () => { calcs(); persist(); };

  $$('[data-k]', app).forEach(el => el.addEventListener('input', () => { d[el.dataset.k] = el.value; if (el.matches('textarea')) autogrow(el); touch(); }));
  $$('[data-from]', app).forEach(el => el.addEventListener('input', () => {
    if (!d.from) d.from = {name: P.name, details: P.details};
    d.from[el.dataset.from] = el.value; if (el.matches('textarea')) autogrow(el); persist();
  }));
  linesEl.addEventListener('input', e => {
    const row = e.target.closest('tr[data-i]'); if (!row || !e.target.dataset.f) return;
    const l = d.lines[+row.dataset.i], f = e.target.dataset.f;
    if (f === 'pctabs' || f === 'sign'){
      const abs = $('[data-f=pctabs]', row).value.trim(), sign = $('[data-f=sign]', row).value;
      l.pct = abs === '' ? '' : (sign === '-' ? '-' : '') + abs;
    } else l[f] = e.target.value;
    if (e.target.matches('textarea')) autogrow(e.target);
    touch();
  });
  linesEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.dataset.f === 'amount'){ e.preventDefault(); addLine('amount'); }
  });
  linesEl.addEventListener('click', e => {
    if (!e.target.matches('[data-del]')) return;
    d.lines.splice(+e.target.closest('tr[data-i]').dataset.i, 1);
    if (!d.lines.length) d.lines.push({kind: 'amount', desc: '', amount: ''});
    drawLines(); touch();
  });
  const addLine = t => {
    d.lines.push(t === 'amount' ? {kind: 'amount', desc: '', amount: ''}
      : t === 'wht' ? {kind: 'percent', desc: 'Withholding tax', pct: '-' + (S.profile.whtRate ?? 20)}
      : {kind: 'percent', desc: '', pct: ''});
    drawLines(); touch();
    const last = linesEl.lastElementChild.querySelector('input,textarea'); if (last) last.focus();
  };
  $$('[data-add]').forEach(b => b.onclick = () => addLine(b.dataset.add));
  $('#client').onchange = e => {
    const c = S.clients.find(x => x.id === e.target.value);
    d.clientId = c ? c.id : '';
    if (c){ d.billTo = [c.name, c.details].filter(Boolean).join('\n'); const t = $('[data-k=billTo]'); t.value = d.billTo; autogrow(t); }
    touch();
  };
  const qs = $('#qstatus'); if (qs) qs.onchange = e => { d.status = e.target.value; persist(); };
  const paid = $('#paid'); if (paid){ paid.oninput = () => { d.paid = paid.value; touch(); }; paid.onchange = () => afterPaid(d); }
  const pf = $('#payfull'); if (pf) pf.onclick = () => { d.paid = (compute(d).total / 100).toFixed(2); paid.value = d.paid; touch(); afterPaid(d); };

  $('#dl').onclick = () => buildPdf(d, P).save(pdfName(d));
  $('#pv').onclick = () => {
    if (!window.jspdf) return toast('PDF library did not load (offline?)');
    const url = buildPdf(d, P).output('bloburl');
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<button class="btn" style="align-self:flex-end">Close preview</button><iframe src="${url}#view=FitH"></iframe>`;
    $('button', m).onclick = () => { m.remove(); URL.revokeObjectURL(url); };
    document.body.appendChild(m);
  };
  $('#up').onclick = async () => {
    if (!accessToken) return toast('Connect Google Drive first (top right).');
    $('#up').disabled = true; d.pdfPending = true; persist(); await flushPdfs(); $('#up').disabled = false;
  };
  $('#save').onclick = async () => {
    if (d.billTo.trim() && !(d.clientId && S.clients.some(x => x.id === d.clientId))){
      const [name, ...rest] = d.billTo.split('\n'), nm = name.trim();
      let c = S.clients.find(x => x.name.toLowerCase() === nm.toLowerCase());
      if (!c){ c = {id: uid(), name: nm, details: rest.join('\n').trim()}; S.clients.push(c); toast('Customer added: ' + nm); }
      d.clientId = c.id;
    }
    persist();
    if (!isQ && payState(d) === 'paid' || d.pdfFileId){ d.pdfPending = true; persist(); if (accessToken){ $('#save').disabled = true; await flushPdfs(); } }
    location.hash = back;
  };
  $('#dup').onclick = () => {
    const n = newDoc(d.type);
    Object.assign(n, JSON.parse(JSON.stringify({...d, id: n.id, number: n.number, date: today(), dueDate: '', status: 'draft', paid: '0', trashed: false, pdfFileId: '', pdfUploadedAt: 0, createdAt: Date.now()})));
    persist(); location.hash = '#/edit/' + n.id;
  };
  const conv = $('#conv');
  if (conv) conv.onclick = () => {
    const n = newDoc('invoice');
    Object.assign(n, JSON.parse(JSON.stringify({...d, id: n.id, type: 'invoice', number: n.number, date: today(), dueDate: '', status: 'draft', paid: '0', trashed: false, pdfFileId: '', pdfUploadedAt: 0, createdAt: Date.now()})));
    d.status = 'accepted'; persist(); location.hash = '#/edit/' + n.id; toast('Invoice created from quote');
  };
  $('#del').onclick = () => {
    if (!confirm(`Delete ${isQ ? 'quote' : 'invoice'} ${d.number}? This cannot be undone.`)) return;
    S.docs = S.docs.filter(x => x.id !== d.id); persist(); toast('Deleted'); location.hash = back;
  };
  drawLines(); drawSig();
}

/* ---------- customers ---------- */
function viewClients(){
  app.innerHTML = `<div class="tools" style="justify-content:space-between"><h1 class="pt" style="margin:0">My Customers</h1><button class="btn navy" id="add">New customer</button></div><div id="out"></div>`;
  const draw = () => {
    $('#out').innerHTML = S.clients.length ? S.clients.map(c => {
      const ds = S.docs.filter(d => d.clientId === c.id && d.type === 'invoice' && !d.trashed), s = stats(ds);
      return `<div class="card custcard" data-id="${c.id}">
        <div class="row2"><div><label class="l" style="margin-top:0">Name</label><input class="field" data-f="name" value="${esc(c.name)}"></div>
        <div><label class="l" style="margin-top:0">Details (address, email…)</label><textarea class="field" data-f="details" rows="3">${esc(c.details)}</textarea></div></div>
        <div class="tools" style="margin:10px 0 0;justify-content:space-between"><span class="hint">${s.n} invoice${s.n === 1 ? '' : 's'} · invoiced ${money(s.total)}${s.due ? ` · owing ${money(s.due)}` : ''}</span><button class="btn sm red" data-del>Delete</button></div>
      </div>`;
    }).join('') : '<div class="card empty">No customers yet. They are also created from the invoice editor with “Save as customer”.</div>';
  };
  $('#out').addEventListener('input', e => { const c = S.clients.find(x => x.id === e.target.closest('[data-id]').dataset.id); c[e.target.dataset.f] = e.target.value; persist(); });
  $('#out').addEventListener('click', e => {
    if (!e.target.matches('[data-del]')) return;
    const id = e.target.closest('[data-id]').dataset.id;
    if (confirm('Delete this customer? Existing invoices keep their bill-to text.')){ S.clients = S.clients.filter(x => x.id !== id); S.docs.forEach(d => { if (d.clientId === id) d.clientId = ''; }); persist(); draw(); }
  });
  $('#add').onclick = () => { S.clients.push({id: uid(), name: 'New customer', details: ''}); persist(); draw(); };
  draw();
}

/* ---------- settings ---------- */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function normalizeImage(src, maxW = 500){
  const img = await loadImg(src);
  const s = Math.min(1, maxW / img.width);
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/png');
}
function trimCanvas(c){
  const x = c.getContext('2d'), {width: w, height: h} = c, data = x.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (data[(j * w + i) * 4 + 3] > 10){ x0 = Math.min(x0, i); x1 = Math.max(x1, i); y0 = Math.min(y0, j); y1 = Math.max(y1, j); }
  if (x1 < x0) return null;
  const m = 6, o = document.createElement('canvas');
  o.width = x1 - x0 + 1 + m * 2; o.height = y1 - y0 + 1 + m * 2;
  o.getContext('2d').drawImage(c, x0, y0, o.width - m * 2, o.height - m * 2, m, m, o.width - m * 2, o.height - m * 2);
  return o.toDataURL('image/png');
}
function viewSettings(){
  const p = S.profile;
  app.innerHTML = `
    <h1 class="pt">Settings</h1>
    <div class="row2" style="align-items:start">
    <div>
      <div class="card">
        <h2 class="st" style="margin-top:0">Your details (default for new documents)</h2>
        <label class="l">Name / business name</label><input class="field" data-p="name" value="${esc(p.name)}">
        <label class="l">Address, phone, tax number, bank details… (printed as typed)</label><textarea class="field" data-p="details" rows="8">${esc(p.details)}</textarea>
        <div class="row2"><div><label class="l">Currency symbol</label><input class="field" data-p="symbol" value="${esc(p.symbol)}"></div>
        <div><label class="l">Currency code</label><input class="field" data-p="currencyCode" value="${esc(p.currencyCode)}"></div></div>
        <label class="l">Withholding tax rate (%) used by the “Withholding tax” button</label><input class="field" data-p="whtRate" inputmode="decimal" value="${esc(p.whtRate ?? 20)}" style="max-width:120px">
        <label class="l">Financial year starts</label><select class="field" data-p="fyStartMonth" style="max-width:160px">${MON.map((m, i) => `<option value="${i + 1}" ${(p.fyStartMonth || 4) === i + 1 ? 'selected' : ''}>1 ${m}</option>`).join('')}</select>
        <label class="l">Default terms &amp; conditions for new documents</label><textarea class="field" data-p="defaultNotes" rows="2">${esc(p.defaultNotes)}</textarea>
        <h2 class="st">Numbering (next number to be used)</h2>
        <div class="row2"><div><label class="l">Invoice</label><input class="field" type="number" data-c="invoice" value="${S.counters.invoice}"></div><div><label class="l">Quote</label><input class="field" type="number" data-c="quote" value="${S.counters.quote}"></div></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2 class="st" style="margin-top:0">Signature</h2>
        ${p.signature ? `<img class="sig" src="${p.signature}" alt="signature">` : '<div class="hint">No signature yet.</div>'}
        <div class="tools" style="justify-content:flex-start;margin:8px 0">
          <label class="btn" style="margin:0">Upload image<input id="sigfile" type="file" accept="image/*" hidden></label>
          ${p.signature ? '<button class="btn red" id="sigclear">Remove</button>' : ''}
        </div>
        <div class="hint">…or draw one (mouse, finger or stylus):</div>
        <canvas class="pad" id="pad" width="840" height="260"></canvas>
        <div class="tools" style="justify-content:flex-start;margin:8px 0 0"><button class="btn" id="padclear">Clear</button><button class="btn navy" id="padsave">Use this drawing</button></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2 class="st" style="margin-top:0">Backup</h2>
        <div class="hint" style="margin-bottom:8px">Your data lives in this browser and, once connected, in your Google Drive (${FOLDER_NAME} / ${DATA_FILE}).</div>
        <div class="tools" style="justify-content:flex-start;margin:0"><button class="btn" id="exp">Export JSON</button>
        <label class="btn" style="margin:0">Import JSON<input id="imp" type="file" accept="application/json" hidden></label>
        <button class="btn" id="pdfall">Upload PDFs of all paid invoices to Drive</button></div>
      </div>
      <div class="card" style="margin-top:14px">
        <h2 class="st" style="margin-top:0">Google Drive</h2>
        <div class="hint">${GOOGLE_CLIENT_ID ? 'OAuth client ID is set in index.html.' : 'No client ID in index.html. Paste it below to test (stored in this browser only), or put it in GOOGLE_CLIENT_ID so it survives a reinstall.'}</div>
        ${GOOGLE_CLIENT_ID ? '' : `<label class="l">OAuth client ID</label><input class="field" id="cid" value="${esc(localStorage.getItem('invoice_app_client_id') || '')}" placeholder="123456-abc.apps.googleusercontent.com"><div class="tools" style="justify-content:flex-start;margin-top:8px"><button class="btn" id="cidsave">Save and reload</button></div>`}
      </div>
    </div></div>`;
  $$('[data-p]').forEach(el => el.oninput = () => { S.profile[el.dataset.p] = el.dataset.p === 'fyStartMonth' ? +el.value : el.dataset.p === 'whtRate' ? (parseFloat(el.value) || 0) : el.value; persist(); });
  $$('[data-c]').forEach(el => el.oninput = () => { S.counters[el.dataset.c] = Math.max(1, parseInt(el.value) || 1); persist(); });
  $('#sigfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async () => { S.profile.signature = await normalizeImage(r.result); persist(); viewSettings(); };
    r.readAsDataURL(f);
  };
  const sc = $('#sigclear'); if (sc) sc.onclick = () => { S.profile.signature = null; persist(); viewSettings(); };
  const padEl = $('#pad'), ctx = padEl.getContext('2d');
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  let drawing = false;
  const pos = e => { const r = padEl.getBoundingClientRect(); return [(e.clientX - r.left) * padEl.width / r.width, (e.clientY - r.top) * padEl.height / r.height]; };
  padEl.onpointerdown = e => { drawing = true; padEl.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
  padEl.onpointermove = e => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); };
  padEl.onpointerup = () => { drawing = false; };
  $('#padclear').onclick = () => ctx.clearRect(0, 0, padEl.width, padEl.height);
  $('#padsave').onclick = () => { const u = trimCanvas(padEl); if (!u) return toast('Draw something first'); S.profile.signature = u; persist(); viewSettings(); };
  $('#pdfall').onclick = () => {
    if (!accessToken) return toast('Connect Google Drive first (top right).');
    const ds = S.docs.filter(d => d.type === 'invoice' && payState(d) === 'paid');
    if (!ds.length) return toast('No fully paid invoices yet.');
    if (!confirm(`Create or refresh PDFs for ${ds.length} paid invoice${ds.length === 1 ? '' : 's'} in your Drive folder?`)) return;
    ds.forEach(d => d.pdfPending = true); persist(); flushPdfs();
  };
  $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'})); a.download = DATA_FILE; a.click(); };
  $('#imp').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { const j = JSON.parse(t); if (!j.v) throw 0; if (!confirm('Replace everything in the app with this file?')) return; S = normalize(j); persist(); viewSettings(); toast('Imported'); }).catch(() => toast('Not a valid backup file'));
  };
  const cs = $('#cidsave'); if (cs) cs.onclick = () => { localStorage.setItem('invoice_app_client_id', $('#cid').value.trim()); location.reload(); };
}

route();
</script>
